repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        language_version: python3
        files: ^python/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      - id: ruff
        args: [--fix]
        files: ^python/

  # Rust formatting
  - repo: https://github.com/rust-lang/rust-clippy
    rev: v0.1.75
    hooks:
      - id: clippy
        files: ^src/

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        files: ^src/

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: detect-private-key

  # PyAirflowTester - DAG/dbt scanning
  - repo: local
    hooks:
      - id: pyairflowtester-scan
        name: PyAirflowTester Scan
        entry: pyairflowtester scan
        language: system
        types: [python]
        files: ^(dags|dbt)/
        pass_filenames: false
        stages: [commit]
