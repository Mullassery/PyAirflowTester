version: 2
updates:
  # Python packaging metadata lives in pyproject.toml at the repo root;
  # Dependabot's pip ecosystem reads that directly.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Rust crate (src/*.rs) -- kept updated even though it's not wired into
  # the shipped CLI (see README "Architecture"), since cargo-audit in
  # ci.yml already found real advisories in its dependency tree.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
