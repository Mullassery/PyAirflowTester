[package]
name = "pyairflowtester"
version = "0.3.0"
edition = "2021"
authors = ["PyAirflowTester Contributors"]
description = "Unified Airflow + dbt reliability and quality platform"
repository = "https://github.com/mullassery/pyairflowtester"
license = "Proprietary"

[lib]
name = "pyairflowtester"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "json", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
